<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- House silhouette in gold -->
  <polygon points="50,4 96,38 82,38 82,96 18,96 18,38 4,38" fill="#C9A84C"/>
  <!-- Dark body overlay -->
  <rect x="18" y="38" width="64" height="58" fill="#0D1B2A"/>
  <!-- Gold door arch -->
  <rect x="36" y="62" width="28" height="34" rx="14" fill="#C9A84C"/>
  <!-- Left window -->
  <rect x="22" y="46" width="16" height="14" rx="2" fill="#C9A84C" opacity="0.7"/>
  <!-- Right window -->
  <rect x="62" y="46" width="16" height="14" rx="2" fill="#C9A84C" opacity="0.7"/>
  <!-- RP on door -->
  <text x="50" y="90" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="900" fill="#0D1B2A" letter-spacing="-0.5">RP</text>
  <!-- Roof highlight triangle -->
  <polygon points="50,4 96,38 4,38" fill="#C9A84C"/>
  <!-- Roof shadow line -->
  <line x1="4" y1="38" x2="96" y2="38" stroke="#0D1B2A" stroke-width="2"/>
</svg>
